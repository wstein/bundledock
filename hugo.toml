baseURL = 'http://localhost:1313/'
locale = 'en-US'
title = 'BundleDock'
disableKinds = ['taxonomy', 'term', 'RSS']

# Keep site-only metadata out of the README rendered by GitHub.
[[cascade]]
  title = 'CLI and quick start'
  description = 'Build the toolbox, initialize a shared volume, and run pinned CLIs in a compatible consumer.'
  weight = 10
  [cascade.target]
    path = '/cli'
    kind = 'page'

[params]
  description = 'Pinned development tools, shared across Linux containers.'
  repository = 'https://github.com/wstein/bundledock'

[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# Mount the repository documentation directly; there are no copied guides.
[[module.mounts]]
  source = 'site/content'
  target = 'content'
[[module.mounts]]
  source = 'README.md'
  target = 'content/cli.md'
[[module.mounts]]
  source = 'docs'
  target = 'content/guides'
  files = ['architecture.md', 'development.md', 'publication.md', 'quay.md', 'bundles.md', 'toolbox.md', 'nixbox.md', 'opentofu.md', 'bun.md', 'node.md', 'node-current.md', 'code-server.md', 'agy.md', 'claude.md', 'codex.md']
[[module.mounts]]
  source = 'site/layouts'
  target = 'layouts'
[[module.mounts]]
  source = 'site/static'
  target = 'static'
[[module.mounts]]
  source = 'assets'
  target = 'static/assets'

[[menus.main]]
  name = 'CLI & quick start'
  pageRef = '/cli'
  weight = 10
[[menus.main]]
  name = 'Bundle overview'
  pageRef = '/guides/bundles'
  weight = 15
[[menus.main]]
  name = 'Tool catalog'
  pageRef = '/guides/toolbox'
  weight = 20
[[menus.main]]
  name = 'Architecture'
  pageRef = '/guides/architecture'
  weight = 30
[[menus.main]]
  name = 'Publication'
  pageRef = '/guides/publication'
  weight = 40
[[menus.main]]
  name = 'Development'
  pageRef = '/guides/development'
  weight = 50
