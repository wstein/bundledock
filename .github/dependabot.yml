version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(actions)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /brand
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
