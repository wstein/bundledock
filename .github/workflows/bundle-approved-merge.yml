name: Merge approved bundle upgrade

on:
  workflow_run:
    workflows: [Validate approved bundle review, CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: bundledock-approved-merge
  cancel-in-progress: false

jobs:
  dispatch-source:
    if: github.event.workflow_run.name == 'Validate approved bundle review' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate review provenance then dispatch exact-head source CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-publication.py --mode dispatch-source

  merge:
    if: github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'main' && github.event.workflow_run.event == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Revalidate exact approval and required source CI then merge and dispatch main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-publication.py --mode merge
