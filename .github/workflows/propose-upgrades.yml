name: Propose upgrades

on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:
    inputs:
      bundle:
        description: Bundle to resolve; all resolves every bundle independently and proposes the changed ones in one pull request (nixbox refreshes its lock and its glibc release binaries and always gets its own pull request)
        type: choice
        default: all
        required: true
        options:
          - all
          - toolbox
          - code-server
          - node
          - node-current
          - bun
          - codex
          - agy
          - claude
          - nixbox
      dry_run:
        description: Show lock changes without creating branches or pull requests
        type: boolean
        default: true
        required: true
      tool:
        description: Optional tool in each selected bundle; leave empty to resolve all tools
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bundles: ${{ steps.select.outputs.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: select
        env:
          SELECTION: ${{ inputs.bundle || 'all' }}
        run: echo "bundles=$(python3 scripts/bundle-config.py --upgrade-selection "$SELECTION")" >> "$GITHUB_OUTPUT"

  proposal:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        bundle: ${{ fromJSON(needs.plan.outputs.bundles) }}
    uses: ./.github/workflows/bundle-upgrade.yml
    with:
      bundle: ${{ matrix.bundle }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      tool: ${{ inputs.tool || '' }}

  # One commit and one pull request for every bundle that changed. A bundle
  # whose resolution failed is named in the body and run summary; the others
  # are still proposed (a partial proposal beats none, and the run stays red).
  propose:
    needs: [plan, proposal]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: bundledock-upgrade-proposal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-upgrade-${{ github.run_attempt }}'
          merge-multiple: true
          path: ${{ runner.temp }}/bundle-upgrade
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-failed-${{ github.run_attempt }}'
          merge-multiple: true
          path: ${{ runner.temp }}/bundle-failed
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Create a lock and inventory topic branch and one reviewable pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPGRADE_RESULT: ${{ runner.temp }}/bundle-upgrade
          FAILED_BUNDLES: ${{ runner.temp }}/bundle-failed
        # Configure credentials only in the write job and remove them on exit.
        run: |
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $credential"
          trap 'git config --local --unset-all http.https://github.com/.extraheader' EXIT
          bash scripts/tool-upgrade.sh publish

  # nixbox moves nixpkgs to the head of nixpkgs-unstable, refreshes its lock and
  # resolves its glibc release binaries (bundles/nixbox/tools) to the newest stable
  # releases. It always gets its own pull request.
  propose-nixbox:
    needs: [plan, proposal]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.bundles), 'nixbox') && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: bundledock-nixbox-upgrade-proposal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'nixbox-lockrefresh-${{ github.run_attempt }}'
          merge-multiple: true
          path: ${{ runner.temp }}/bundle-upgrade
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Create a lock topic branch and one reviewable nixbox pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPGRADE_RESULT: ${{ runner.temp }}/bundle-upgrade
          PROPOSAL_GROUP: nixbox
        # Configure credentials only in the write job and remove them on exit.
        run: |
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $credential"
          trap 'git config --local --unset-all http.https://github.com/.extraheader' EXIT
          bash scripts/tool-upgrade.sh publish
