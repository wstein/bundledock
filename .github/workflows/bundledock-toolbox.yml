name: Publish toolbox

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full main commit SHA explicitly approved by the user for this build and publication
        required: true
        type: string

permissions:
  contents: read

# A single publisher owns stable. Queue approved publications without
# cancelling a native smoke test or allowing concurrent stable updates.
concurrency:
  group: bundledock-toolbox-publish
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      pr_url: ${{ steps.source.outputs.pr_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Preflight code comes from trusted default-branch execution SHA, never CI input.
          ref: ${{ github.sha }}
      - name: Validate publication source without compiling artifacts
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            python3 scripts/toolbox-publication.py
          else
            sh scripts/approve-publication.sh
            echo "sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
          fi

  approval:
    name: Approve toolbox ${{ needs.preflight.outputs.sha }}
    if: github.event_name == 'workflow_run'
    needs: preflight
    permissions:
      contents: read
      actions: read
      pull-requests: read
    environment:
      name: toolbox-publication
      url: ${{ needs.preflight.outputs.pr_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Revalidate source and environment after human approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/toolbox-publication.py

  resolve:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    needs: [preflight, approval]
    # always permits the manual path's skipped approval job only.
    if: >-
      always() && needs.preflight.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.event.repository.default_branch == 'main' &&
        github.ref == 'refs/heads/main' && github.event.sender.type == 'User' &&
        inputs.approved_sha == github.sha) ||
       (github.event_name == 'workflow_run' && needs.approval.result == 'success'))
    env:
      PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Require the user's approval for this exact main revision
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: sh scripts/approve-publication.sh
      - name: Revalidate approved merged toolbox source before compiling
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/toolbox-publication.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check manager and publication gates
        run: make check
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Resolve all tools once
        env:
          REPOSITORY_URL: ${{ vars.REPOSITORY_URL }}
          # Manager sends this read-only token only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            "$RUNNER_TEMP/tools-publish" resolve --frozen-lock
          else
            "$RUNNER_TEMP/tools-publish" resolve
          fi
      - name: Compare resolved tools with the published baseline
        id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        # Fixed-host HTTP reads request a pull-only Quay token. No Docker login
        # or registry writes occur until the native smoke tests pass.
        run: '"$RUNNER_TEMP/tools-publish" plan'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-tools-${{ github.run_attempt }}
          path: resolved/
          if-no-files-found: error
          retention-days: 90

  native:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: >-
      always() && needs.preflight.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.event.repository.default_branch == 'main' &&
        github.ref == 'refs/heads/main' && github.event.sender.type == 'User' &&
        inputs.approved_sha == github.sha) ||
       (github.event_name == 'workflow_run' && needs.approval.result == 'success')) &&
      needs.resolve.result == 'success' && needs.resolve.outputs.publish == 'true'
    needs: [preflight, approval, resolve]
    env:
      PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Require the user's approval for this exact main revision
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: sh scripts/approve-publication.sh
      - name: Revalidate approved merged toolbox source before compiling
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/toolbox-publication.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-tools-${{ github.run_attempt }}
          path: resolved/
      - name: Use temporary registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/quay-auth" >> "$GITHUB_ENV"
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Build once and smoke on the native architecture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: '"$RUNNER_TEMP/tools-publish" build --architecture "$ARCHITECTURE"'
      - name: Log in to Quay after native smoke passes
        env:
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        run: printf '%s' "$REPOSITORY_TOKEN" | docker login quay.io --username "$REPOSITORY_USERNAME" --password-stdin
      - name: Push the exact smoked image to its run staging tag
        env:
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: '"$RUNNER_TEMP/tools-publish" push --architecture "$ARCHITECTURE"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: published-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout quay.io

  promote:
    if: >-
      always() && needs.preflight.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.event.repository.default_branch == 'main' &&
        github.ref == 'refs/heads/main' && github.event.sender.type == 'User' &&
        inputs.approved_sha == github.sha) ||
       (github.event_name == 'workflow_run' && needs.approval.result == 'success')) &&
      needs.resolve.result == 'success' && needs.native.result == 'success' &&
      needs.resolve.outputs.publish == 'true'
    env:
      PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # The matrix must succeed in its entirety. A failed native smoke test leaves
    # stable and the final version tag untouched, even if the other arch staged.
    needs: [preflight, approval, resolve, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Require the user's approval for this exact main revision
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: sh scripts/approve-publication.sh
      - name: Revalidate approved merged toolbox source before compiling
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/toolbox-publication.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-tools-${{ github.run_attempt }}
          path: resolved/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-*-${{ github.run_attempt }}
          path: receipts/
      - name: Use temporary registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/quay-auth" >> "$GITHUB_ENV"
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Refuse publication when a newer eligible run exists
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/tools-publish" newest'
      - name: Revalidate current main immediately before promotion
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/toolbox-publication.py
      - name: Log in to Quay
        env:
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        run: printf '%s' "$REPOSITORY_TOKEN" | docker login quay.io --username "$REPOSITORY_USERNAME" --password-stdin
      - name: Verify both platform manifests and promote version, stable and latest
        env:
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        run: '"$RUNNER_TEMP/tools-publish" promote'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.run_attempt }}
          path: publication.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout quay.io
