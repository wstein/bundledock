name: Publish toolbox

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full main commit SHA explicitly approved for build and publication
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  publication:
    # Reusable-workflow ceiling; write scopes are used only by post-promotion jobs.
    permissions:
      contents: write
      actions: write
      pull-requests: write
    uses: ./.github/workflows/bundle-publish.yml
    with:
      bundle: toolbox
      approved_sha: ${{ inputs.approved_sha || '' }}
    secrets:
      REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
