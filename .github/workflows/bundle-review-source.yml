name: Validate approved bundle review

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-review:
    if: github.event.review.user.login == 'wstein' && github.event.review.state == 'approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/heads/main
      - name: Validate exact approved updater head with trusted main code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-publication.py --mode review
