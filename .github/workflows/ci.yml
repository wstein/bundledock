name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Optional exact source SHA required by the approved bundle controller
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the dispatched source revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check formatting, tests and vet
        run: make check
