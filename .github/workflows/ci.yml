# Source CI. A bdock/vX.Y.Z tag push also runs this workflow (unfiltered push); the tag-driven
# CLI release in release.yml requires a successful push run of this workflow for the tagged commit.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Optional exact source SHA required by the source CI caller
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the dispatched source revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check formatting, tests and vet
        run: make check
      - name: Vet the release platforms
        env:
          CGO_ENABLED: '0'
        run: |
          # Compiler verification only, no artifact: release.yml builds these platforms on a tag.
          GOOS=linux GOARCH=amd64 go vet ./cmd/... ./internal/...
          GOOS=linux GOARCH=arm64 go vet ./cmd/... ./internal/...
          GOOS=darwin GOARCH=arm64 go vet ./cmd/... ./internal/...

  # Informative only: evidence for which Python tests fail on real macOS. Deliberately absent from
  # any required check, and continue-on-error keeps its result from failing the workflow run.
  python-tests-macos:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Show the host
        run: |
          sw_vers
          uname -m
          python3 --version
          make --version | head -1
          go version
          echo "::notice title=host::$(sw_vers | tr '\n' ' ') | $(uname -m) | $(python3 --version) | $(make --version | head -1) | $(go version)"
      - name: Run the Python test suite as make check does
        run: |
          umask 022
          set -o pipefail
          status=0
          python3 -B -m unittest discover -s scripts/tests 2>&1 | tee "$RUNNER_TEMP/suite.log" || status=1
          python3 scripts/macos-ci-annotate.py "$RUNNER_TEMP/suite.log" || true
          python3 -B -m unittest discover -s scripts -p '*_test.py' 2>&1 | tee "$RUNNER_TEMP/scripts.log" || status=1
          python3 scripts/macos-ci-annotate.py "$RUNNER_TEMP/scripts.log" || true
          exit "$status"
      - name: Run the suspect test modules verbosely (shim, codex, rolling locks, toolbox and nixbox build workflows)
        if: always()
        run: |
          umask 022
          set -o pipefail
          status=0
          for mod in test_nixbox_shim test_codex_smoke test_rolling_locks test_toolbox_build_workflow test_nixbox_build_workflow; do
            echo "::group::$mod"
            python3 -B -m unittest discover -v -s scripts/tests -p "$mod.py" 2>&1 | tee "$RUNNER_TEMP/$mod.log" || status=1
            python3 scripts/macos-ci-annotate.py "$RUNNER_TEMP/$mod.log" || true
            echo "::endgroup::"
          done
          exit "$status"
