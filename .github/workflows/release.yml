# Owner decision 2026-10-17 ("bdock wie smill", see AGENTS.md and
# docs/design/bdock-release-workflow): an owner-pushed tag bdock/vMAJOR.MINOR.PATCH is the
# publication approval for that tag's CLI release; a manual run is a dry run that never
# publishes. This workflow releases the bdock CLI only, never an OCI image. Nothing is
# signed or notarized; the publish job attests build provenance for the archives and SHA256SUMS.
name: release

on:
  push:
    tags: ['bdock/v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Dry-run version label (a dispatch never publishes)
        required: false
        default: 0.0.0-dryrun
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Resolve the version and the run kind
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            version=$(sh .github/scripts/release-verify.sh tag-version "$REF_NAME")
            tag=$REF_NAME
            dry_run=false
          else
            version=$INPUT_VERSION
            sh .github/scripts/release-verify.sh dryversion "$version"
            tag=
            dry_run=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dry_run=$dry_run"
            echo "commit=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Require the repository owner to have started the run
        shell: bash
        env:
          ACTOR: ${{ github.triggering_actor }}
          PUSHER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "$OWNER" || { echo "run started by $ACTOR, not by the repository owner $OWNER" >&2; exit 1; }
          test "$PUSHER" = "$OWNER" || { echo "run originally started by $PUSHER, not by the repository owner $OWNER" >&2; exit 1; }
      - name: Require an annotated tag on a commit of main
        if: steps.resolve.outputs.dry_run == 'false'
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fetch the tag object itself so a lightweight tag is not mistaken for an annotated one.
          git fetch --force --no-tags "https://github.com/$REPO" "+refs/tags/$TAG:refs/tags/$TAG"
          git fetch --force --no-tags "https://github.com/$REPO" '+refs/heads/main:refs/remotes/origin/main'
          commit=$(sh .github/scripts/release-verify.sh tag "$TAG" refs/remotes/origin/main)
          test "$commit" = "$GITHUB_SHA" || { echo "tag $TAG names $commit but the run is for $GITHUB_SHA" >&2; exit 1; }
      - name: Require a green CI run for the tagged commit
        if: steps.resolve.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Retries the head_sha query, then filters the push runs by head_sha client side.
          sh .github/scripts/release-verify.sh ci-green "$GITHUB_SHA"
      - name: Require that no release exists for the tag
        if: steps.resolve.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if out=$(gh api "repos/$REPO/releases/tags/$TAG" 2>&1); then
            echo "a release for $TAG already exists" >&2
            exit 1
          fi
          case "$out" in
            *"HTTP 404"*) echo "no release for $TAG yet" ;;
            *) echo "cannot tell whether a release exists: $out" >&2; exit 1 ;;
          esac
      - name: Require a version above every existing release
        if: steps.resolve.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Tags (annotated ones peeled) and releases, so a deleted tag with a surviving release counts too.
          tags=$(git ls-remote --tags "https://github.com/$REPO" 'refs/tags/bdock/v*' | cut -f2 | sed 's|^refs/tags/||; s|\^{}$||')
          releases=$(gh api "repos/$REPO/releases" --paginate --jq '.[].tag_name')
          printf '%s\n%s\n' "$tags" "$releases" | sh .github/scripts/release-verify.sh monotonic "$TAG"
      - run: make check
      - run: go mod verify

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Build bdock twice and compare
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT" || { echo "checkout is not the verified commit $COMMIT" >&2; exit 1; }
          # scripts/release.sh is the single archive builder; output stays outside the checkout.
          TARGETS="$OS/$ARCH" RELEASE_DIR="$RUNNER_TEMP/first" sh scripts/release.sh
          # A second build with an empty build cache must give the same bytes.
          GOCACHE="$RUNNER_TEMP/gocache-second" TARGETS="$OS/$ARCH" RELEASE_DIR="$RUNNER_TEMP/second" sh scripts/release.sh
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          grep -Fx "source_revision=$COMMIT" "$RUNNER_TEMP/first/PROVENANCE"
          grep -Fx "source_modified=false" "$RUNNER_TEMP/first/PROVENANCE"
          mkdir "$RUNNER_TEMP/dist"
          name="bdock_${VERSION}_${OS}_${ARCH}.tar.gz"
          cp "$RUNNER_TEMP/first/$name" "$RUNNER_TEMP/dist/$name"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.os }}/${{ matrix.arch }})
    needs: [verify, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist
      - name: Smoke-test the shipped archive natively
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT" || { echo "checkout is not the verified commit $COMMIT" >&2; exit 1; }
          sh .github/scripts/release-smoke.sh "$VERSION" "$COMMIT" "$OS" "$ARCH" "$RUNNER_TEMP/dist/bdock_${VERSION}_${OS}_${ARCH}.tar.gz"

  publish:
    name: publish
    needs: [verify, build, smoke]
    if: needs.verify.outputs.dry_run == 'false' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Assemble and check the release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          ACTOR: ${{ github.triggering_actor }}
          PUSHER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # A re-run by someone else must not publish on the owner's earlier approval.
          test "$ACTOR" = "$OWNER" || { echo "run triggered by $ACTOR, not by the repository owner $OWNER" >&2; exit 1; }
          test "$PUSHER" = "$OWNER" || { echo "run originally started by $PUSHER, not by the repository owner $OWNER" >&2; exit 1; }
          # Drafts are invisible to the verify job's read token; refuse any release, draft or not, for the tag.
          existing=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          test -z "$existing" || { echo "a release (possibly a draft) for $TAG already exists: $existing" >&2; exit 1; }
          # The tag must still name the verified commit; the owner may have moved it during the run.
          remote=$(git ls-remote "https://github.com/$REPO" "refs/tags/$TAG^{}" | cut -f1)
          test "$remote" = "$COMMIT" || { echo "tag $TAG now names '$remote', not the verified $COMMIT" >&2; exit 1; }
          # The version order again, with the write token, which also lists drafts.
          tags=$(git ls-remote --tags "https://github.com/$REPO" 'refs/tags/bdock/v*' | cut -f2 | sed 's|^refs/tags/||; s|\^{}$||')
          releases=$(gh api "repos/$REPO/releases" --paginate --jq '.[].tag_name')
          printf '%s\n%s\n' "$tags" "$releases" | sh .github/scripts/release-verify.sh monotonic "$TAG"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          cd "$RUNNER_TEMP/dist"
          test "$(ls -1 -- bdock_*.tar.gz | wc -l)" -eq 3 || { echo "expected exactly three archives" >&2; exit 1; }
          for platform in darwin_arm64 linux_amd64 linux_arm64; do
            test -f "bdock_${VERSION}_${platform}.tar.gz" || { echo "missing archive for $platform" >&2; exit 1; }
          done
          cat -- bdock_*.tar.gz.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3 || { echo "expected exactly three checksums" >&2; exit 1; }
          sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/bdock_*.tar.gz
            ${{ runner.temp }}/dist/SHA256SUMS
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          DRAFT: ${{ vars.BDOCK_RELEASE_DRAFT }}
        run: |
          set -euo pipefail
          sh .github/scripts/release-notes.sh "$TAG" "$COMMIT" "$(cat .go-version)" > "$RUNNER_TEMP/notes.md"
          test -z "$DRAFT" -o "$DRAFT" = true -o "$DRAFT" = false || { echo "BDOCK_RELEASE_DRAFT must be empty, true or false, got $DRAFT" >&2; exit 1; }
          flags=()
          if [ "$DRAFT" = true ]; then flags+=(--draft); fi
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "bdock v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" ${flags[@]+"${flags[@]}"} \
            "$RUNNER_TEMP"/dist/bdock_*.tar.gz "$RUNNER_TEMP/dist/SHA256SUMS"
