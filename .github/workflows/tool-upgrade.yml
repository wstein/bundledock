name: Propose tool upgrades

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve and show the lock diff without creating a branch or pull request
        type: boolean
        default: true
        required: true
      tool:
        description: Optional tool name from tools.txt; leave empty to resolve all tools
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: bundledock-tool-upgrade
  cancel-in-progress: false

jobs:
  resolve:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Resolve stable releases and summarize the proposed lock diff
        id: resolve
        env:
          TOOL: ${{ github.event_name == 'workflow_dispatch' && inputs.tool || '' }}
          # The manager sends this read-only token only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
          UPGRADE_RESULT: ${{ runner.temp }}/tool-upgrade
        run: bash scripts/tool-upgrade.sh resolve
      - name: Transfer the resolved lock and generated inventory to the PR job
        if: ${{ steps.resolve.outputs.changed == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-upgrade-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tool-upgrade/tools.lock.json
            ${{ runner.temp }}/tool-upgrade/tools.md
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ needs.resolve.outputs.changed == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tool-upgrade-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tool-upgrade
      - name: Create a lock and inventory topic branch and reviewable pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPGRADE_RESULT: ${{ runner.temp }}/tool-upgrade
        # Configure credentials only in the write job and remove them on exit.
        run: |
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $credential"
          trap 'git config --local --unset-all http.https://github.com/.extraheader' EXIT
          bash scripts/tool-upgrade.sh publish
