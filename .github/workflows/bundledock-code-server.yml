name: Publish code-server

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full main commit SHA explicitly approved for build and publication
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  publication:
    # Reusable-workflow ceiling; only its post-promotion tag job requests write.
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/bundle-publish.yml
    with:
      bundle: code-server
      approved_sha: ${{ inputs.approved_sha || '' }}
    secrets:
      REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
