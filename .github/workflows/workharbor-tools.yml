name: Publish workharbor-tools

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A single publisher owns stable. Queue manual and scheduled runs without
# cancelling a native smoke test or allowing concurrent stable updates.
concurrency:
  group: workharbor-tools-publish
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check manager and publication gates
        run: make check
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Resolve all tools once
        env:
          QUAY_IMAGE: ${{ vars.QUAY_IMAGE }}
          # Manager sends this read-only token only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/tools-publish" resolve'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-tools-${{ github.run_attempt }}
          path: resolved/
          if-no-files-found: error
          retention-days: 90

  native:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-tools-${{ github.run_attempt }}
          path: resolved/
      - name: Use temporary registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/quay-auth" >> "$GITHUB_ENV"
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Build once and smoke on the native architecture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: '"$RUNNER_TEMP/tools-publish" build --architecture "$ARCHITECTURE"'
      - name: Log in to Quay after native smoke passes
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: printf '%s' "$QUAY_PASSWORD" | docker login quay.io --username "$QUAY_USERNAME" --password-stdin
      - name: Push the exact smoked image to its run staging tag
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: '"$RUNNER_TEMP/tools-publish" push --architecture "$ARCHITECTURE"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: published-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout quay.io

  promote:
    permissions:
      contents: read
      actions: read
    # The matrix must succeed in its entirety. A failed native smoke test leaves
    # stable and the final version tag untouched, even if the other arch staged.
    needs: [resolve, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-tools-${{ github.run_attempt }}
          path: resolved/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-*-${{ github.run_attempt }}
          path: receipts/
      - name: Use temporary registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/quay-auth" >> "$GITHUB_ENV"
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Refuse publication when a newer eligible run exists
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/tools-publish" newest'
      - name: Log in to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: printf '%s' "$QUAY_PASSWORD" | docker login quay.io --username "$QUAY_USERNAME" --password-stdin
      - name: Verify both platform manifests and promote version and stable
        run: '"$RUNNER_TEMP/tools-publish" promote'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.run_attempt }}
          path: publication.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout quay.io
