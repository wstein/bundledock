name: Shared bundle publication

on:
  workflow_call:
    inputs:
      bundle:
        required: true
        type: string
      approved_sha:
        required: false
        default: ''
        type: string
    secrets:
      REPOSITORY_TOKEN:
        required: true

permissions:
  contents: read

# A single publisher owns stable. Queue approved publications without
# cancelling a native smoke test or allowing concurrent stable updates.
concurrency:
  group: bundledock-${{ inputs.bundle }}-publish
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      pr_url: ${{ steps.source.outputs.pr_url }}
      artifact: ${{ steps.source.outputs.artifact }}
      eligible: ${{ steps.source.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Preflight code comes from trusted default-branch execution SHA, never CI input.
          ref: ${{ github.sha }}
      - name: Validate publication source without compiling artifacts
        id: source
        env:
          BUNDLE: ${{ inputs.bundle }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            python3 scripts/bundle-publication.py --bundle "$BUNDLE" --mode preflight
          else
            sh scripts/approve-publication.sh
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
            python3 scripts/bundle-publication.py --bundle "$BUNDLE" --mode config
          fi

  resolve:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    needs: preflight
    if: >-
      needs.preflight.result == 'success' && needs.preflight.outputs.eligible == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.event.repository.default_branch == 'main' &&
        github.ref == 'refs/heads/main' && github.event.sender.type == 'User' &&
        inputs.approved_sha == github.sha) ||
       (github.event_name == 'workflow_run'))
    env:
      PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
      BUNDLE: ${{ inputs.bundle }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Require the user's approval for this exact main revision
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: sh scripts/approve-publication.sh
      - name: Revalidate approved merged bundle source before compiling
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-publication.py --bundle "$BUNDLE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check manager and publication gates
        run: make check
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Resolve all tools once
        env:
          REPOSITORY_URL: ${{ vars.REPOSITORY_URL }}
          # Manager sends this read-only token only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            "$RUNNER_TEMP/tools-publish" resolve --bundle "$BUNDLE" --frozen-lock
          else
            "$RUNNER_TEMP/tools-publish" resolve --bundle "$BUNDLE"
          fi
      - name: Compare resolved tools with the published baseline
        id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        # Fixed-host HTTP reads request a pull-only Quay token. No Docker login
        # or registry writes occur until the native smoke tests pass.
        run: '"$RUNNER_TEMP/tools-publish" plan --bundle "$BUNDLE"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.preflight.outputs.artifact }}-${{ github.run_attempt }}
          path: resolved/
          if-no-files-found: error
          retention-days: 90

  native:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: >-
      needs.preflight.result == 'success' && needs.preflight.outputs.eligible == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.event.repository.default_branch == 'main' &&
        github.ref == 'refs/heads/main' && github.event.sender.type == 'User' &&
        inputs.approved_sha == github.sha) ||
       (github.event_name == 'workflow_run')) &&
      needs.resolve.result == 'success' && needs.resolve.outputs.publish == 'true'
    needs: [preflight, resolve]
    env:
      PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
      BUNDLE: ${{ inputs.bundle }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Require the user's approval for this exact main revision
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: sh scripts/approve-publication.sh
      - name: Revalidate approved merged bundle source before compiling
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-publication.py --bundle "$BUNDLE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact }}-${{ github.run_attempt }}
          path: resolved/
      - name: Use temporary registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/quay-auth" >> "$GITHUB_ENV"
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Build once and smoke on the native architecture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: '"$RUNNER_TEMP/tools-publish" build --bundle "$BUNDLE" --architecture "$ARCHITECTURE"'
      - name: Log in to Quay after native smoke passes
        env:
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        run: printf '%s' "$REPOSITORY_TOKEN" | docker login quay.io --username "$REPOSITORY_USERNAME" --password-stdin
      - name: Push the exact smoked image to its run staging tag
        env:
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: '"$RUNNER_TEMP/tools-publish" push --bundle "$BUNDLE" --architecture "$ARCHITECTURE"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.bundle }}-published-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: published-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout quay.io

  promote:
    if: >-
      needs.preflight.result == 'success' && needs.preflight.outputs.eligible == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.event.repository.default_branch == 'main' &&
        github.ref == 'refs/heads/main' && github.event.sender.type == 'User' &&
        inputs.approved_sha == github.sha) ||
       (github.event_name == 'workflow_run')) &&
      needs.resolve.result == 'success' && needs.native.result == 'success' &&
      needs.resolve.outputs.publish == 'true'
    env:
      PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
      BUNDLE: ${{ inputs.bundle }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # The matrix must succeed in its entirety. A failed native smoke test leaves
    # stable and the final version tag untouched, even if the other arch staged.
    needs: [preflight, resolve, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Require the user's approval for this exact main revision
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: sh scripts/approve-publication.sh
      - name: Revalidate approved merged bundle source before compiling
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-publication.py --bundle "$BUNDLE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact }}-${{ github.run_attempt }}
          path: resolved/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.bundle }}-published-*-${{ github.run_attempt }}
          path: receipts/
      - name: Use temporary registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/quay-auth" >> "$GITHUB_ENV"
      - name: Compile CI adapter
        run: go build -o "$RUNNER_TEMP/tools-publish" ./cmd/tools-publish
      - name: Refuse publication when a newer eligible run exists
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/tools-publish" newest --bundle "$BUNDLE"'
      - name: Revalidate approved source immediately before promotion
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-publication.py --bundle "$BUNDLE"
      - name: Log in to Quay
        env:
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        run: printf '%s' "$REPOSITORY_TOKEN" | docker login quay.io --username "$REPOSITORY_USERNAME" --password-stdin
      - name: Verify both platform manifests and promote version, stable and latest
        env:
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        run: '"$RUNNER_TEMP/tools-publish" promote --bundle "$BUNDLE"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.bundle }}-publication-${{ github.run_attempt }}
          path: publication.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout quay.io

  tag:
    if: needs.promote.result == 'success' && needs.resolve.outputs.publish == 'true'
    needs: [preflight, resolve, promote]
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
      BUNDLE: ${{ inputs.bundle }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.bundle }}-publication-${{ github.run_attempt }}
          path: .
      - name: Tag the verified publication source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_USERNAME: ${{ vars.REPOSITORY_USERNAME }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 -B scripts/bundle-git-tags.py --publication publication.json --bundle "$BUNDLE" --write

  documentation:
    if: >-
      needs.promote.result == 'success' && needs.tag.result == 'success' &&
      needs.resolve.outputs.publish == 'true'
    needs: [preflight, resolve, promote, tag]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.bundle }}-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-docs-receipt
      - name: Propose verified publication Markdown source and run source CI
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ inputs.bundle }}
          REPOSITORY_URL: ${{ vars.REPOSITORY_URL }}
          PUBLICATION_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          python3 -B scripts/publication-docs.py \
            --receipt "$RUNNER_TEMP/publication-docs-receipt/publication.json" \
            --bundle "$BUNDLE" --image "${REPOSITORY_URL%/}/$BUNDLE" \
            --sha "$PUBLICATION_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --propose
