name: Publish documentation

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full main SHA explicitly approved by the user for the documentation build and Pages deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bundledock-pages-publish
  cancel-in-progress: false
  queue: max

env:
  GH_TOKEN: ${{ github.token }}
  APPROVED_SHA: ${{ inputs.approved_sha }}
  PUBLICATION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  CI_RUN_ID: ${{ github.event.workflow_run.id }}
  CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  SENDER_TYPE: ${{ github.event.sender.type }}
  TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  build:
    if: >-
      github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && github.event.sender.type == 'User' && inputs.approved_sha == github.sha) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    outputs:
      sha: ${{ steps.approval.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify Pages approval and exact current-main CI
        id: approval
        run: sh scripts/approve-publication.sh --pages
      - name: Check out the exact CI-verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.approval.outputs.sha }}
      - name: Build documentation with verified official Hugo
        env:
          HUGO_BASEURL: https://wstein.github.io/bundledock/
        run: make docs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: github-pages-${{ steps.approval.outputs.sha }}-${{ github.run_attempt }}
          path: public/
          retention-days: 1

  deploy:
    needs: build
    env:
      PUBLICATION_SHA: ${{ needs.build.outputs.sha }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify Pages approval and exact current-main CI
        id: approval
        run: sh scripts/approve-publication.sh --pages
      - name: Deploy the approved documentation artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ needs.build.outputs.sha }}-${{ github.run_attempt }}
